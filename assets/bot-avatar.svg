<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#5aa8ff"/>
      <stop offset="1" stop-color="#16327a"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e5ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a0"/>
      <stop offset="1" stop-color="#f3a21c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#bcd6ff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#08163f" flood-opacity=".45"/>
    </filter>
    <path id="spark" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- faint sparkles, like the symbol pattern on Telegram gift backdrops -->
  <g fill="#fff" opacity=".22">
    <use href="#spark" transform="translate(150 150) scale(1.1)"/>
    <use href="#spark" transform="translate(490 140) scale(.8)"/>
    <use href="#spark" transform="translate(110 360) scale(.7)"/>
    <use href="#spark" transform="translate(540 330) scale(1)"/>
    <use href="#spark" transform="translate(200 540) scale(.8)"/>
    <use href="#spark" transform="translate(320 95) scale(.6)"/>
  </g>

  <!-- gift box -->
  <g filter="url(#shadow)">
    <rect x="160" y="300" width="250" height="185" rx="24" fill="url(#box)"/>
    <rect x="140" y="240" width="290" height="80" rx="22" fill="#fff"/>
    <rect x="265" y="240" width="40" height="245" fill="url(#gold)"/>
    <rect x="140" y="300" width="290" height="14" fill="#16327a" opacity=".08"/>
    <path d="M285 240C240 168 172 186 196 228c14 24 62 18 89 12Z" fill="url(#gold)"/>
    <path d="M285 240c45-72 113-54 89-12-14 24-62 18-89 12Z" fill="url(#gold)"/>
    <circle cx="285" cy="240" r="19" fill="#f3a21c"/>
  </g>

  <!-- magnifier: "finder" -->
  <g filter="url(#shadow)">
    <!-- starts under the ring's stroke so the handle doesn't show through the glass -->
    <line x1="470" y1="470" x2="510" y2="510" stroke="#0d1a44" stroke-width="36" stroke-linecap="round"/>
    <circle cx="405" cy="405" r="72" fill="url(#glass)" stroke="#0d1a44" stroke-width="22"/>
    <path d="M362 388a46 46 0 0 1 34-30" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".85"/>
  </g>
</svg>
